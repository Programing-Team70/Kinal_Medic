services:
  mongo:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user-student-service:
    build: ./user-student-service
    ports:
      - "3001:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/students_db
    depends_on:
      - mongo

  medical-records-service:
    build: ./medical-records-service
    ports:
      - "3002:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/medical_db
    depends_on:
      - mongo

  inventory-service:
    build: ./inventory-service
    ports:
      - "3003:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/inventory_db
      - JWT_SECRET=KinalMedicSuperSecretaParaJWT2024!!Segura
      - JWT_ISSUER=KinalMedic
      - JWT_AUDIENCE=KinalMedic
    depends_on:
      - mongo

  availability-service:
    build: 
      context: ./availability-service
      dockerfile: Dockerfile
    ports:
      - "3004:8080"
    environment:
      - JWT_SECRET=KinalMedicSuperSecretaParaJWT2024!!Segura
      - ConnectionStrings__MongoDb=mongodb://mongo:27017
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - mongo

  notification-service:
    build: ./notification-service
    container_name: kinalmedic-notification-service
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      - EMAIL_USER=programingteam70@gmail.com
      - EMAIL_PASS=fstc wpzh frpp fooi
    depends_on:
      - mongo

volumes:
  mongo_data: